<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        const PhotographyRedirectList = ['photography', 'p'];
        const PrivateRedirectList = ['private', 'priv', 'client', 'clientphotos', 'clientshots', 'societyball',
        'warwickball', 'gallery', 'onlinegallery', 'privategallery', 'secure', 'securegallery', 'secureshots'];
        const EventRedirectList = ['event', 'events', 'formal'];

        const AcademiaRedirectList = ['academia', 'a', 'academic'];
        const CareerRedirectList = ['career', 'c', 'job', 'jobs'];
        const ProjectsRedirectList = ['proj', 'project', 'projects', 'stuff'];

        const BaseRedirects = [...PhotographyRedirectList, ...AcademiaRedirectList];
        const AllRedirects = [...BaseRedirects, ...PrivateRedirectList, ...EventRedirectList, ...CareerRedirectList, ...ProjectsRedirectList];

        const PathTree = window.location.pathname.split('/').filter(segment => segment);
        const LastSegment = PathTree[PathTree.length - 1] ? PathTree[PathTree.length - 1].toLowerCase() : '';
        const BaseName = 'https://www.alfiekunz.co.uk/';

        if (AllRedirects.includes(LastSegment) && (PathTree.length === 1 || (PathTree.length === 2 && BaseRedirects.includes(PathTree[0].toLowerCase())) )) {
            if (PhotographyRedirectList.includes(LastSegment)) {
                window.location.replace(BaseName + 'photography');
            } else if (PrivateRedirectList.includes(LastSegment)) {
                window.location.replace(BaseName + 'photography/gallery/?category=private');
            } else if (EventRedirectList.includes(LastSegment)) {
                window.location.replace(BaseName + 'photography/gallery/?category=event');

            } else if (AcademiaRedirectList.includes(LastSegment)) {
                window.location.replace(BaseName + 'academia');
            } else if (CareerRedirectList.includes(LastSegment)) {
                window.location.replace(BaseName + 'academia/career');
            } else if (ProjectsRedirectList.includes(LastSegment)) {
                window.location.replace(BaseName + 'academia/projects');
            }
        } else {
            // Redirects up a branch.
            RedirectToParent();
        }

        async function RedirectToParent() {
            async function DoesPathExist(path) {
                try {
                    const response = await fetch(path, { method: 'HEAD' });
                    return response.ok;
                } catch {
                    return false;
                }
            }
            
            async function FindClosestParent() {
                let PathTreeSegments = [...PathTree];
                
                while (PathTreeSegments.length > 0) {
                    PathTreeSegments.pop();
                    const Parent = '/' + PathTreeSegments.join('/');
                    if (await DoesPathExist(Parent) || PathTreeSegments.length === 0) {
                        window.location.replace(Parent || '/');
                        return;
                    }
                }
                window.location.replace('/');
            }
            FindClosestParent();
        }
    </script>
</head>
</html>
