<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        const HubBase = 'https://hub.alfiekunz.co.uk/';
        const AcademiaBase = 'https://alfiekunz.co.uk/';
        const PhotoBase = 'https://photography.alfiekunz.co.uk/';

        const PhotographyRedirectList = ['photography', 'photo', 'p'];
        const PrivateRedirectList = ['private', 'priv', 'client', 'clientphotos', 'clientshots', 'societyball',
        'warwickball', 'gallery', 'onlinegallery', 'privategallery', 'secure', 'securegallery', 'secureshots'];
        const EventRedirectList = ['e', 'event', 'events', 'formal'];

        const AcademiaRedirectList = ['academia', 'a', 'ac', 'academic'];
        const CareerRedirectList = ['career', 'c', 'job', 'jobs'];
        const ProjectsRedirectList = ['proj', 'project', 'projects', 'stuff'];

        const HubRedirectList = ['hub', 'h', 'main', 'm', 'splash', 'head']

        const RedirectDict = new Map([
            ['cv', AcademiaBase + 'assets/Alfie Kunz CV.pdf'],
            ['epq', AcademiaBase + 'assets/projects/EPQ/Alfie Kunz EPQ - Neutron Stars.pdf'],
            ['warwick', AcademiaBase + 'career/#warwick'],
            ['beckfoot', AcademiaBase + 'career/#beckfoot'],

            ['apic', AcademiaBase + 'projects/#CFD-APIC-Vortices'],
            ['apicessay', AcademiaBase + 'assets/projects/ProjectAPIC/Real-time Simulations of Momentum-Conserving Vortices - Alfie Kunz.pdf'],
            ['chess', AcademiaBase + 'projects/#Chess-Game-AI'],
            ['chessreport', AcademiaBase + 'assets/projects/ProjectChess/Alfie Kunz Computer Science NEA Project Report.pdf'],
            ['chesstracking', AcademiaBase + 'assets/projects/ProjectChess/Previous AI Search Efficiency Tracking (Plotted - 27.12.24).pdf'],
            ['chesstournament', AcademiaBase + 'projects/#Chess-Tournament'],
            ['chessbook', AcademiaBase + 'projects/#Chess-Book-Builder'],
            ['chessmagic', AcademiaBase + 'projects/#Chess-Magic'],
            ['ising', AcademiaBase + 'assets/projects/ProjectIsing/Probing the Correlation Length of Metastable Annuli through Thermal Erosion in the 2D Ising Model.pdf'],
            ['nn', AcademiaBase + 'projects/#Neural-Networking'],
            ['risk', AcademiaBase + 'projects/#Risk-Calculator'],
            ['slime', AcademiaBase + 'projects/#Slime-Trails'],
            ['tetris', AcademiaBase + 'projects/#Tetris-AI'],
            ['tictactoe', AcademiaBase + 'projects/#TicTacToe'],
            ['web', AcademiaBase + 'projects/#Website-Portfolio'],

            ['landscape', PhotoBase + 'gallery/?category=landscape'],
            ['portrait', PhotoBase + 'gallery/?category=portrait'],
            ['nature', PhotoBase + 'gallery/?category=nature'],
            ['studio', PhotoBase + 'gallery/?category=studio'],
            ['travel', PhotoBase + 'gallery/?category=travel'],
            ['corporate', PhotoBase + 'gallery/?category=corporate'],
            ['astro', PhotoBase + 'gallery/?category=astro'],
            ['sport', PhotoBase + 'gallery/?category=sport']
        ]);

        const BaseRedirects = [...PhotographyRedirectList, ...AcademiaRedirectList];
        const AllRedirects = [...BaseRedirects, ...PrivateRedirectList, ...EventRedirectList, ...CareerRedirectList, ...ProjectsRedirectList, ...RedirectDict.keys()];

        const PathTree = window.location.pathname.split('/').filter(segment => segment);
        const LastSegment = PathTree[PathTree.length - 1] ? PathTree[PathTree.length - 1].toLowerCase() : '';

        if (AllRedirects.includes(LastSegment) && (PathTree.length === 1 || (PathTree.length === 2 && BaseRedirects.includes(PathTree[0].toLowerCase())) )) {
            if (PhotographyRedirectList.includes(LastSegment)) {
                window.location.replace(PhotoBase);
            } else if (PrivateRedirectList.includes(LastSegment)) {
                window.location.replace(PhotoBase + 'gallery/?category=private');
            } else if (EventRedirectList.includes(LastSegment)) {
                window.location.replace(PhotoBase + 'gallery/?category=event');
            } else if (AcademiaRedirectList.includes(LastSegment)) {
                window.location.replace(AcademiaBase);
            } else if (CareerRedirectList.includes(LastSegment)) {
                window.location.replace(AcademiaBase + 'career/');
            } else if (ProjectsRedirectList.includes(LastSegment)) {
                window.location.replace(AcademiaBase + 'projects/');
            } else if (RedirectDict.has(LastSegment)) {
                window.location.replace(RedirectDict.get(LastSegment));
            } else if (HubRedirectList.includes(LastSegment)) {
                window.location.replace(HubBase);
            }
        } else if (PathTree.length !== 0) {
            RedirectToParent();
        }

        async function RedirectToParent() {
            async function DoesPathExist(path) {
                try {
                    const response = await fetch(path, { method: 'HEAD' });
                    return response.ok;
                } catch {
                    return false;
                }
            }
            
            async function FindClosestParent() {
                let PathTreeSegments = [...PathTree];
                
                while (PathTreeSegments.length > 0) {
                    PathTreeSegments.pop();
                    const Parent = '/' + PathTreeSegments.join('/');
                    if (await DoesPathExist(Parent) || PathTreeSegments.length === 0) {
                        window.location.replace(Parent);
                        return;
                    }
                }
                window.location.replace('/');
            }
            FindClosestParent();
        }
    </script>
</head>
</html>
